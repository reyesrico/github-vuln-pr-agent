name: Security PR Agent

on:
  repository_dispatch:
    types:
      - advisory-email-received
  workflow_dispatch:
    inputs:
      advisory_email:
        description: "Raw GitHub advisory email text to process. Required in alert-driven mode."
        required: true
        type: string
      account_login:
        description: "Optional account/org login to scope auto-discovered repositories."
        required: false
        type: string
      alert_repositories:
        description: "Optional comma-separated repository list (owner/repo)."
        required: false
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate advisory signal payload
        env:
          RAW_GITHUB_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.advisory_email || github.event.client_payload.advisory_email || '' }}
        run: |
          if [[ -z "${RAW_GITHUB_EMAIL// }" ]]; then
            echo "Missing advisory payload. This workflow runs only when a new alert payload is received."
            exit 1
          fi

      - name: Run vulnerability PR agent
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_AGENT_GITHUB_TOKEN }}
          ACCOUNT_LOGIN: ${{ inputs.account_login || vars.ACCOUNT_LOGIN }}
          ALERT_REPOSITORIES: ${{ inputs.alert_repositories || vars.ALERT_REPOSITORIES }}
          RAW_GITHUB_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.advisory_email || github.event.client_payload.advisory_email || '' }}
          PROCESS_ONLY_EMAIL_SIGNAL: true
          DRY_RUN: ${{ vars.DRY_RUN }}
          VULN_SEVERITIES: ${{ vars.VULN_SEVERITIES }}
          BRANCH_PREFIX: ${{ vars.BRANCH_PREFIX }}
          MAX_ALERTS_PER_REPO: ${{ vars.MAX_ALERTS_PER_REPO }}
          REPO_COMMANDS: ${{ vars.REPO_COMMANDS }}
          INSTALL_RETRY_WITH_LEGACY_PEER_DEPS: ${{ vars.INSTALL_RETRY_WITH_LEGACY_PEER_DEPS }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          EMAIL_FAIL_OPEN: ${{ vars.EMAIL_FAIL_OPEN }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npm run dev
