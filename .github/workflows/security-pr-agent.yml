name: Security PR Agent

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      advisory_email:
        description: "Optional raw GitHub advisory email text. When provided, only matching new advisory alerts are processed."
        required: false
        type: string
      account_login:
        description: "Optional account/org login to scope auto-discovered repositories."
        required: false
        type: string
      alert_repositories:
        description: "Optional comma-separated repository list (owner/repo)."
        required: false
        type: string
      process_only_email_signal:
        description: "When true, skip processing unless advisory_email (or RAW_GITHUB_EMAIL variable) provides a signal."
        required: false
        default: true
        type: boolean

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vulnerability PR agent
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_AGENT_GITHUB_TOKEN }}
          ACCOUNT_LOGIN: ${{ inputs.account_login || vars.ACCOUNT_LOGIN }}
          ALERT_REPOSITORIES: ${{ inputs.alert_repositories || vars.ALERT_REPOSITORIES }}
          RAW_GITHUB_EMAIL: ${{ inputs.advisory_email || vars.RAW_GITHUB_EMAIL }}
          PROCESS_ONLY_EMAIL_SIGNAL: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.process_only_email_signal) || vars.PROCESS_ONLY_EMAIL_SIGNAL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          VULN_SEVERITIES: ${{ vars.VULN_SEVERITIES }}
          BRANCH_PREFIX: ${{ vars.BRANCH_PREFIX }}
          MAX_ALERTS_PER_REPO: ${{ vars.MAX_ALERTS_PER_REPO }}
          REPO_COMMANDS: ${{ vars.REPO_COMMANDS }}
          INSTALL_RETRY_WITH_LEGACY_PEER_DEPS: ${{ vars.INSTALL_RETRY_WITH_LEGACY_PEER_DEPS }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
          EMAIL_FAIL_OPEN: ${{ vars.EMAIL_FAIL_OPEN }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npm run dev
