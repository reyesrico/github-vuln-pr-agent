name: E2E Recommendation Simulation

on:
  workflow_dispatch:

jobs:
  run-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run recommendation E2E
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_AGENT_GITHUB_TOKEN }}
          E2E_TARGET_REPO: ${{ vars.E2E_TARGET_REPO }}
          E2E_LIBRARY: ${{ vars.E2E_LIBRARY }}
          E2E_LIBRARY_VERSION: ${{ vars.E2E_LIBRARY_VERSION }}
          E2E_RAW_EMAIL: ${{ vars.E2E_RAW_EMAIL }}
          E2E_EMAIL_MODE: ${{ vars.E2E_EMAIL_MODE }}
          E2E_FLOW_MODE: ${{ vars.E2E_FLOW_MODE }}
          E2E_AUTO_CLOSE_ON_ERROR: ${{ vars.E2E_AUTO_CLOSE_ON_ERROR }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npm run e2e:recommendation
